name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/main.ts src/ui/app.js src/ui/registry-plan.js
      - run: deno task test
      - name: Compile smoke test
        run: |
          deno task compile:linux
          ./dist/toolbelt-bridge-linux-x64 version
